name: Deploy simTool to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "simTool/**"
      - ".github/workflows/deploy-simtool-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: simTool/package-lock.json

      - name: Install dependencies
        working-directory: simTool
        run: npm ci

      - name: Lint
        working-directory: simTool
        run: npm run lint

      - name: Typecheck
        working-directory: simTool
        run: npm run typecheck

      - name: Test
        working-directory: simTool
        run: npm test

      - name: Build
        working-directory: simTool
        env:
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.VITE_GITHUB_OAUTH_CLIENT_ID }}
          VITE_GITHUB_OAUTH_EXCHANGE_URL: ${{ vars.VITE_GITHUB_OAUTH_EXCHANGE_URL }}
          VITE_GITHUB_OAUTH_SCOPE: public_repo
          VITE_GITHUB_OAUTH_REDIRECT_URI: https://pdoeble.github.io/RenntnerHazienda/
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: simTool/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
